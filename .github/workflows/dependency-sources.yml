name: Dependency sources

on:
  pull_request:
    paths:
      - .github/workflows/dependency-sources.yml
      - Pipfile
      - Pipfile.lock
      - pyproject.toml
      - uv.lock
      - presidio_service/requirements.txt
      - replit.md
  push:
    branches: [master]
    paths:
      - .github/workflows/dependency-sources.yml
      - Pipfile
      - Pipfile.lock
      - pyproject.toml
      - uv.lock
      - presidio_service/requirements.txt
      - replit.md

permissions:
  contents: read

concurrency:
  group: dependency-sources-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"

      - name: Validate canonical dependency sources
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Pipfile
          test ! -e Pipfile.lock
          uv lock --check
          grep --fixed-strings '`pyproject.toml`' replit.md
          grep --fixed-strings '`uv.lock`' replit.md
          grep --fixed-strings '`presidio_service/requirements.txt`' replit.md
