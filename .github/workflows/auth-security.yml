name: Auth security

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: auth-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: presidio_service/requirements.txt
      # The regression suite replaces the heavyweight Presidio engines with
      # test doubles; Flask supplies the real session and password-hash paths.
      - name: Install test runtime
        run: python -m pip install "flask>=3.1.3"
      - name: Run authentication regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          presidio_service/app.py
          presidio_service/security_config.py
          tests/test_presidio_auth_config.py
