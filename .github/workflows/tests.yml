name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: presidio_service/requirements.txt
      - run: pip install -r presidio_service/requirements.txt pytest
      - run: python -m spacy download en_core_web_lg
      - run: pytest tests/ -v
